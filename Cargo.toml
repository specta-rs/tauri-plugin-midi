[package]
name = "tauri-plugin-midi"
links = "tauri-plugin-midi"
description = "A WebMIDI-compatible plugin for Tauri"
license = "MIT"
version = "0.3.1"
authors = ["Brendan Allan", "Oscar Beaumont"]
edition = "2021"
rust-version = "1.90"
include = ["/src", "/build.rs", "/permissions", "/LICENSE", "/README.md", "/CHANGELOG.md"]
repository = "https://github.com/specta-rs/tauri-plugin-midi"
documentation = "https://docs.rs/tauri-plugin-midi"
keywords = ["tauri", "midi", "webmidi", "tauri-plugin"]
categories = ["web-programming"]

# /bin/sh RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
#
# Do NOT add `rustc-args = ["--cfg", "docsrs"]` here. docs.rs turns `rustc-args`
# into RUSTFLAGS, which cargo applies to every crate in the build including
# dependencies. The old `toml_edit`/`winnow`/`toml_datetime` crates that Tauri's
# Linux GTK stack drags in still start with
# `#![cfg_attr(docsrs, feature(doc_auto_cfg))]`, and `doc_auto_cfg` was removed
# in Rust 1.92, so those dependencies fail with E0557 before our crate is even
# reached. docs.rs already passes `--cfg docsrs` to rustdoc, which is the only
# place this crate needs it.
[package.metadata."docs.rs"]
all-features = true

[features]
# Enables the specta/tauri-specta derives so `cargo test --features specta` can
# regenerate the TypeScript bindings. Off by default so the plugin does not ship
# specta at runtime.
specta = ["dep:specta", "dep:tauri-specta"]

[dependencies]
midir = "0.11"
serde = "1"
# `tauri-specta` re-exports its own `specta`, and both are pinned to an exact
# release, so these two move together: a `specta` newer than the one
# `tauri-specta` depends on cannot resolve. Bump them in the same commit once
# `tauri-specta` publishes the matching release.
specta = { version = "=2.0.0-rc.26", optional = true }
tauri = "2.12.4"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive"], optional = true }
tokio = { version = "1.54.0", features = ["time"] }

[dev-dependencies]
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript"] }
specta-typescript = { version = "0.0.13" }

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
