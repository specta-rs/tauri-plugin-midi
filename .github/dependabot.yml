version: 2

multi-ecosystem-groups:
  midi-deps:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "midi-deps"
    patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    multi-ecosystem-group: "midi-deps"
    patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/example/src-tauri"
    multi-ecosystem-group: "midi-deps"
    patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "midi-deps"
    patterns: ["*"]
