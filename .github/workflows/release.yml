name: release

# crates.io *trusted publishing*: crates.io mints a short-lived token from this
# workflow's OIDC identity, so no long-lived `CARGO_REGISTRY_TOKEN` is stored in
# this repository or in Actions secrets. See `README.md` → "Releasing" for the
# one-time crates.io configuration.
#
# The four crates.io values must match this file exactly, or the token exchange
# is refused:
#   owner        specta-rs
#   repository   tauri-plugin-midi
#   workflow     release.yml
#   environment  release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `tauri` links WebKitGTK/GTK and `midir` links ALSA on Linux, so the crate
      # cannot even be compiled without these.
      - name: Install Tauri's Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Install Rust
        run: rustup update --no-self-update stable && rustup default stable
      - run: rustc --version && cargo --version

      - name: The tag must match the crate version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tauri-plugin-midi") | .version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version v$version"
            exit 1
          fi

      # The published crate embeds `src/polyfill.js` via `include_str!`, but the JS
      # test suite bundles `guest-js/` from source — so a stale committed artifact
      # would ship silently. Rebuild and require the artifact to be unchanged.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The committed polyfill must match a fresh build
        run: |
          pnpm build
          git diff --exit-code -- src/polyfill.js

      - run: pnpm test

      - name: Regenerating the TypeScript bindings must be a no-op
        run: |
          cargo test --features specta
          git diff --exit-code -- guest-js/bindings.ts

      - run: cargo test

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    # Must match the `environment` of the trusted publisher configured on
    # crates.io. Require reviewers on that environment to gate publishing.
    environment: release
    permissions:
      id-token: write # exchange the GitHub OIDC token for a crates.io token
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `tauri` links WebKitGTK/GTK and `midir` links ALSA on Linux, so the crate
      # cannot even be compiled without these.
      - name: Install Tauri's Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Install Rust
        run: rustup update --no-self-update stable && rustup default stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      - name: cargo publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
