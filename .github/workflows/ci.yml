name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # `tauri` links WebKitGTK/GTK and `midir` links ALSA on Linux, so the crate
      # cannot even be compiled without these.
      - name: Install Tauri's Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Install Rust
        run: rustup update --no-self-update stable && rustup default stable
      - run: rustc --version && cargo --version
      - run: cargo fmt --all --check

      # `src/polyfill.js` is committed and embedded into the crate with
      # `include_str!`, but the JS tests bundle `guest-js/` from source — so a
      # stale artifact would ship silently. Rebuild and require it to be unchanged.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The committed polyfill must match a fresh build
        run: |
          pnpm build
          git diff --exit-code -- src/polyfill.js

      - run: pnpm test

      - name: Regenerating the TypeScript bindings must be a no-op
        run: |
          cargo test --features specta
          git diff --exit-code -- guest-js/bindings.ts

      - run: cargo test
