name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `tauri` links WebKitGTK/GTK and `midir` links ALSA on Linux, so the crate
      # cannot even be compiled without these.
      - name: Install Tauri's Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Install Rust
        run: rustup update --no-self-update stable && rustup default stable
      - run: rustc --version && cargo --version
      - run: cargo fmt --all --check

      # `src/polyfill.js` is committed and embedded into the crate with
      # `include_str!`, but the JS tests bundle `guest-js/` from source — so a
      # stale artifact would ship silently. Rebuild and require it to be unchanged.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The committed polyfill must match a fresh build
        run: |
          pnpm build
          git diff --exit-code -- src/polyfill.js

      - run: pnpm test

      - name: Regenerating the TypeScript bindings must be a no-op
        run: |
          cargo test --features specta
          git diff --exit-code -- guest-js/bindings.ts

      - run: cargo test
